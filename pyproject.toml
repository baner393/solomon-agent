[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "solomon-agent"
version = "0.1.0a1"
description = "Independent knowledge-backed reply agent with streaming voice integration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "baner393" }]
dependencies = [
  "pydantic-ai-slim[openai]==2.55.0",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "jieba==0.42.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.17.0",
  "build==1.6.1",
]

[project.scripts]
solomon-agent = "solomon_agent.cli:main"

[project.urls]
Homepage = "https://github.com/baner393/solomon-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/solomon_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
